syntax = "proto3";

package tickless.matching.v1;

import "tickless/common/v1/common.proto";

// Commands are written by the orders service (transactional outbox) to the
// topic matching.commands, keyed and partitioned by market.
// Events are written by the matching service to matching.events, same key.
// Numeric enum values mirror the engine package constants.

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_PLACE = 1;
  COMMAND_TYPE_CANCEL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_ACCEPTED = 1;
  EVENT_TYPE_REJECTED = 2;
  EVENT_TYPE_TRADE = 3;
  EVENT_TYPE_CANCELLED = 4;
  EVENT_TYPE_BOOK_DELTA = 5;
}

// Reason mirrors engine.Reason.
enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_INVALID_QTY = 1;
  REASON_INVALID_PRICE = 2;
  REASON_INVALID_SIDE = 3;
  REASON_INVALID_COMBO = 4;
  REASON_DUPLICATE_ORDER = 5;
  REASON_POST_ONLY_WOULD_CROSS = 6;
  REASON_UNKNOWN_ORDER = 7;
  REASON_UNKNOWN_COMMAND = 8;
  REASON_CANCEL_USER = 9;
  REASON_CANCEL_IOC_REMAINDER = 10;
  REASON_CANCEL_FOK_UNFILLED = 11;
  REASON_CANCEL_SELF_TRADE = 12;
  REASON_INVALID_ORDER_ID = 13;
}

message Command {
  string market = 1;
  CommandType type = 2;
  uint64 order_id = 3;
  uint64 user_id = 4;
  tickless.common.v1.Side side = 5;
  OrderType order_type = 6;
  TimeInForce tif = 7;
  bool post_only = 8;
  // Price in ticks (limit price, or protective bound for market orders; 0 = none).
  int64 price = 9;
  // Quantity in lots.
  int64 qty = 10;
  int64 time_unix_nano = 11;
}

message Event {
  string market = 1;
  // Per-market gap-free sequence number. Consumers dedupe on (market, seq).
  uint64 seq = 2;
  int64 time_unix_nano = 3;
  EventType type = 4;
  Reason reason = 5;
  tickless.common.v1.Side side = 6;
  uint64 order_id = 7;
  uint64 user_id = 8;
  uint64 maker_order_id = 9;
  uint64 maker_user_id = 10;
  int64 price = 11;
  int64 qty = 12;
  int64 taker_leaves = 13;
  int64 maker_leaves = 14;
  uint64 trade_id = 15;
}
