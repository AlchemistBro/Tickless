syntax = "proto3";

package tickless.users.v1;

import "tickless/common/v1/common.proto";

// UserEvent is the single message type of the users.events topic (key: user id).
message UserEvent {
  tickless.common.v1.EventMeta meta = 1;
  int64 user_id = 2;
  oneof event {
    UserSignedUp signed_up = 3;
    UserFrozen frozen = 4;
  }
}

message UserSignedUp {
  string email = 1;
  // Opaque email verification token; consumed by the notifier to build the link.
  string verification_token = 2;
}

message UserFrozen {
  bool frozen = 1;
}
