syntax = "proto3";

package tickless.ledger.v1;

import "tickless/common/v1/common.proto";

service LedgerService {
  // PlaceHold moves amount from the user's available to held balance for an
  // order. Idempotent by order_id. FAILED_PRECONDITION when funds are insufficient.
  rpc PlaceHold(PlaceHoldRequest) returns (PlaceHoldResponse);
  // ReleaseHold returns what remains of an order's hold to available. Idempotent.
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse);
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  // AdminCredit credits (or with a negative amount debits) a user against the
  // EXTERNAL account. Idempotent by business_key. Used for deposits and, when
  // enabled by configuration, for seeding balances in development.
  rpc AdminCredit(AdminCreditRequest) returns (AdminCreditResponse);
  // HoldWithdrawal moves amount from the user's available to held balance for
  // a withdrawal. Idempotent by withdrawal_id. FAILED_PRECONDITION when funds
  // are insufficient.
  rpc HoldWithdrawal(HoldWithdrawalRequest) returns (HoldWithdrawalResponse);
  // SettleWithdrawal moves the held amount to EXTERNAL (the funds left the
  // exchange). Idempotent; FAILED_PRECONDITION if the hold was released.
  rpc SettleWithdrawal(SettleWithdrawalRequest) returns (SettleWithdrawalResponse);
  // ReleaseWithdrawal returns the held amount to available. Idempotent;
  // FAILED_PRECONDITION if the hold was settled.
  rpc ReleaseWithdrawal(ReleaseWithdrawalRequest) returns (ReleaseWithdrawalResponse);
}

message PlaceHoldRequest {
  uint64 order_id = 1;
  int64 user_id = 2;
  string asset = 3;
  tickless.common.v1.Amount amount = 4;
}

message PlaceHoldResponse {
  // True when the hold already existed (idempotent replay).
  bool already_held = 1;
}

message ReleaseHoldRequest {
  uint64 order_id = 1;
}

message ReleaseHoldResponse {
  tickless.common.v1.Amount released = 1;
}

message GetBalancesRequest {
  int64 user_id = 1;
}

message Balance {
  string asset = 1;
  tickless.common.v1.Amount available = 2;
  tickless.common.v1.Amount held = 3;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message ListEntriesRequest {
  int64 user_id = 1;
  string asset = 2;
  // Return entries with id < before_id (0 = newest).
  int64 before_id = 3;
  int32 limit = 4;
}

message Posting {
  string asset = 1;
  string account_kind = 2;
  tickless.common.v1.Amount amount = 3;
}

message Entry {
  int64 id = 1;
  string business_key = 2;
  string kind = 3;
  int64 created_at_unix_nano = 4;
  repeated Posting postings = 5;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
}

message AdminCreditRequest {
  string business_key = 1;
  int64 user_id = 2;
  string asset = 3;
  tickless.common.v1.Amount amount = 4;
}

message AdminCreditResponse {
  bool already_applied = 1;
  int64 entry_id = 2;
}

// BalanceChanged is published to ledger.events (key: user id) whenever a
// user balance changes, for private WebSocket fan-out.
message BalanceChanged {
  tickless.common.v1.EventMeta meta = 1;
  int64 user_id = 2;
  string asset = 3;
  tickless.common.v1.Amount available = 4;
  tickless.common.v1.Amount held = 5;
  int64 entry_id = 6;
  string reason = 7;
}

message HoldWithdrawalRequest {
  int64 withdrawal_id = 1;
  int64 user_id = 2;
  string asset = 3;
  tickless.common.v1.Amount amount = 4;
}

message HoldWithdrawalResponse {
  // True when the hold already existed (idempotent replay).
  bool already_applied = 1;
}

message SettleWithdrawalRequest {
  int64 withdrawal_id = 1;
}

message SettleWithdrawalResponse {
  bool already_applied = 1;
}

message ReleaseWithdrawalRequest {
  int64 withdrawal_id = 1;
}

message ReleaseWithdrawalResponse {
  bool already_applied = 1;
}
