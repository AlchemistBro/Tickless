<text x="30" y="985" font-size="15" font-weight="700" fill="#444">Ключевые потоки</text>
<text x="30" y="1012" font-size="13"  fill="#444">Ордер: gateway → orders → ledger (холд) → Kafka matching.commands → matching → matching.events → orders, ledger, marketdata, candles.</text>
<text x="30" y="1036" font-size="13"  fill="#444">Депозит: wallet выдаёт адрес → chainwatcher ждёт подтверждения → deposits.events → ledger зачисляет один раз → notifier шлёт письмо.</text>
<text x="30" y="1060" font-size="13"  fill="#444">Вывод: gateway → withdrawals (TOTP, лимит) → ledger (холд) → проверка → автоисполнение или ревью администратора → signer (mTLS) → цепь → ledger.</text>
<text x="30" y="1084" font-size="13"  fill="#444">Все события публикуются через outbox в той же транзакции, что и изменение данных; потребители идемпотентны.</text>
