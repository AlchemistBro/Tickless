global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  # Application metrics are pushed over OTLP to the collector and exposed here.
  - job_name: tickless-apps
    honor_labels: true
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
