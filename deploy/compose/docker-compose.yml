# Tickless local stack. Local-development credentials only; nothing here is a secret.
name: tickless

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: tickless
      POSTGRES_PASSWORD: tickless
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "wal_level=logical"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickless -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    <<: *restart
    environment:
      DB_HOST: postgres
      DB_USER: tickless
      DB_PASSWORD: tickless
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 40
      ADMIN_USERS: tickless
    ports: ["6432:5432"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Single-node KRaft (no ZooKeeper). INTERNAL for containers, EXTERNAL for host tools/tests.
    image: apache/kafka:3.9.0
    <<: *restart
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9092:9092"]
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    # Creates the topics documented in docs/events.md. Idempotent.
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    volumes: ["./kafka-topics.sh:/kafka-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/kafka-topics.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    <<: *restart
    environment:
      RABBITMQ_DEFAULT_USER: tickless
      RABBITMQ_DEFAULT_PASS: tickless
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    <<: *restart
    environment:
      CLICKHOUSE_USER: tickless
      CLICKHOUSE_PASSWORD: tickless
      CLICKHOUSE_DB: tickless
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    volumes: ["chdata:/var/lib/clickhouse"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.22
    <<: *restart
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    # Distroless: no shell, so no container healthcheck. scripts/wait-up.sh probes :13133.
    image: otel/opentelemetry-collector-contrib:0.116.1
    <<: *restart
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../observability/otel/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "13133:13133", "8889:8889"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.2.0
    <<: *restart
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v3.1.0
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.28.0
    <<: *restart
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["../observability/alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  kafkadata:
  rabbitdata:
  chdata:
  promdata:
  grafanadata:
