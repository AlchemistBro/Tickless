version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - bodyclose
    - misspell
    - unconvert
    - forbidigo
  settings:
    gosec:
      excludes:
        # G115 (int<->uint conversions) flags the deliberate two's-complement and
        # wire-format reinterpretations in pkg/money and the engine snapshot codec;
        # those are covered by differential fuzz tests instead.
        - G115
    forbidigo:
      forbid:
        - pattern: 'float(32|64)\('
          msg: "no floats in money paths (ADR 0001); use pkg/money"
  exclusions:
    paths:
      - pkg/gen
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
formatters:
  enable: [gofmt, goimports]
  exclusions:
    paths: [pkg/gen]
