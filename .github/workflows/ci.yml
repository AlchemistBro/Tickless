name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: pkg/go.mod}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.14.0, working-directory: pkg}
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.14.0, working-directory: services/matching}
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          format: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: pkg/go.mod}
      - name: Unit tests (race) with coverage
        run: make test
      - name: Short fuzz run
        run: make fuzz
      - name: Engine targets (SPEC §5)
        run: make bench

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - if: failure()
        run: make ps && docker compose -f deploy/compose/docker-compose.yml logs --tail=50
      - if: always()
        run: make down
