# Equivalent of .github/workflows/ci.yml
stages: [lint, test, smoke]

lint:
  stage: lint
  image: golangci/golangci-lint:v2.14.0
  script:
    - cd pkg && golangci-lint run ./...

buf:
  stage: lint
  image: bufbuild/buf:latest
  script:
    - buf lint
    - 'if [ -n "$CI_MERGE_REQUEST_ID" ]; then buf breaking --against "$CI_REPOSITORY_URL#branch=main"; fi'

test:
  stage: test
  image: golang:1.27
  script:
    - apt-get update -qq && apt-get install -y -qq make
    - make test
    - make fuzz

compose-smoke:
  stage: smoke
  image: docker:27
  services: [docker:27-dind]
  variables: {DOCKER_HOST: tcp://docker:2375, DOCKER_TLS_CERTDIR: ""}
  before_script: [apk add --no-cache make bash curl]
  script:
    - make up
  after_script:
    - make down
